name: veeenz
description: "A New Flutter Game."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  assets_audio_player: ^3.0.5
  bitsdojo_window: ^0.1.6
  confetti: ^0.7.0
  cupertino_icons: ^1.0.2
  equatable: ^2.0.5
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.0
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.0.10+1
  flutter_vibrate: ^1.3.0
  font_awesome_flutter: ^10.2.1
  get: ^4.6.5
  get_storage: ^2.0.3
  google_fonts: ^6.2.1
  http: ^1.2.1
  percent_indicator: ^4.2.2
  rename: ^3.0.2
  shared_preferences: ^2.0.15

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:

  uses-material-design: true
  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/
    - assets/audios/
    - assets/images/
    - assets/wallpapers/dices.jpg
    - assets/wallpapers/fantasy.jpg
    - assets/wallpapers/moon.jpg
    - assets/wallpapers/mountains.jpg
    - assets/wallpapers/mushroom.jpg
    - assets/wallpapers/neon.jpg
    - assets/wallpapers/squares.jpg
